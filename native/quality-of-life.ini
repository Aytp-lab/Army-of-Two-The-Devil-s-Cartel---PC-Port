; Quality-of-Life-Funktionen fuer Army of Two: The Devil's Cartel (nativer Port)
; Behebt Fehler des Originalspiels. Gilt im Alpha-Modus und im Tausch-Modus (Bravo).
; Werte: an/aus (auch 1/0, ja/nein, on/off). Aenderungen gelten ab dem naechsten Spielstart.

[QualityOfLife]

; Dialogzweig-Fix: Manche Dialoge waehlen im Original per Zufall zwischen zwei Varianten
; (z.B. "wer faehrt?") und pruefen erst danach, ob die Variante passt. Passt sie nicht,
; bleibt es still. Mit "an" wird nur unter den passenden Varianten gewaehlt.
; Betrifft u.a. Outskirts Auto (OS_08_*), Church CH_01_Failed, Barrio Br_04_18,
; Drogenlabor DL_01_03, Ghosttown GT_09_01/GT_09_05, Koop-Ruf Friendly_CSA_Blocked.
dialogzweig_fix = an

; MG-Ansage-Fix (Outskirts Auto): Faehrt Bravo und Alpha sitzt am Geschuetz, ruft im Original
; Alpha sich selbst "Heads up, machine gun!" und "Aim for the explosive" zu. Mit "an" ruft
; stattdessen der Fahrer Bravo "Mounted machine gun!" (seine Originalzeile aus der anderen Variante).
mg_ansage_fix = an

; Ausruestungs-Ladefix: prueft nach jedem Spawn/Laden und weiter im Level die echten
; Koerper-/Outfit-Ressourcen beider Figuren. Fehlende normale Ausruestung wird mit den
; Original-Ladern nachgeladen; Spieler-Profil und gewaehlte Partnerausruestung bleiben
; massgeblich. Absichtlich ausgeblendete Outfits und Missionskoerper (z.B. Drogenlabor)
; werden respektiert. Auch ohne Rollentausch/Aussehensmods aktiv.
ausruestung_ladefix = an

; Splash ueberspringen: startet direkt AO4.Main statt erst AO4.Splash (Logos, fehlendes Intro-Video,
; mehrfaches Umschalten des Audiogeraets). Diese Phase war die haeufigste Absturzstelle beim Start.
; Mit "an" geht es direkt zum "Start druecken"-Bildschirm des Hauptspiels.
splash_ueberspringen = aus

; Bildrate 60 (EXPERIMENTELL): Spiellogik und Bild mit echten 60 Bildern pro Sekunde statt 30.
; Korrigiert die 30-Hz-Annahmen des Originals (Spieluhr, Weltuhr, Physik, Takte pro Bild,
; Zeitgeberlisten, KI-Rechenbudget); Spieltempo bleibt original. Setzt intern 120-Hz-Vblank
; und synchronen Readback. Bekanntes Restproblem: gelegentlich bleibt ein Gegner in Deckung
; untaetig hocken. Wirkt nur mit dem 60-FPS-Stand der Haupt-DLL (Start-60FPS.cmd).
bildrate_60 = aus
